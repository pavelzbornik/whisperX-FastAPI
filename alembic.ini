[alembic]
# Path to migration scripts.
script_location = %(here)s/alembic

# Template used to generate migration file names.
# Timestamp prefix keeps revisions in chronological order on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# %(here)s is the directory holding this file, so both paths resolve the same
# way no matter which directory alembic is invoked from. A bare relative path
# would resolve against the caller's working directory instead.
prepend_sys_path = %(here)s
path_separator = os

# sqlalchemy.url is intentionally not set here — alembic/env.py reads it from
# the application settings (DB_URL) so migrations and the app can never point at
# different databases.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
